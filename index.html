<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#eef3f1">
<link rel="manifest" href="manifest.json">
<script src="config.js"></script>
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>SnapBudget</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js"></script>
<style>
:root{--bg:#eef3f1;--card:#fff;--ink:#16302b;--mute:#5d746e;--line:#d3e0db;--accent:#0f766e;--accent-ink:#fff;--hi:#f4c542;--err:#b4301f;--ok:#15803d;--warn:#b45309}
@media (prefers-color-scheme:dark){:root:not([data-theme]){--bg:#0e1b18;--card:#162824;--ink:#e6f1ee;--mute:#92aaa4;--line:#27403a;--accent:#3fc1b2;--accent-ink:#06201c;--err:#ff8b78;--ok:#4ade80;--warn:#fbbf24}}
[data-theme=light]{--bg:#eef3f1;--card:#fff;--ink:#16302b;--mute:#5d746e;--line:#d3e0db;--accent:#0f766e;--accent-ink:#fff;--err:#b4301f;--ok:#15803d;--warn:#b45309}
[data-theme=dark]{--bg:#0e1b18;--card:#162824;--ink:#e6f1ee;--mute:#92aaa4;--line:#27403a;--accent:#3fc1b2;--accent-ink:#06201c;--err:#ff8b78;--ok:#4ade80;--warn:#fbbf24}
[data-theme=cream]{--bg:#fbf3dc;--card:#fffaf0;--ink:#3a2a10;--mute:#7a6540;--line:#eadcb4;--accent:#8a5a00;--accent-ink:#fff;--err:#b4301f;--ok:#15803d;--warn:#b45309}
[data-theme=olive]{--bg:#eaeddb;--card:#f6f7ec;--ink:#2c3319;--mute:#646b4a;--line:#d3d8b8;--accent:#55672a;--accent-ink:#fff;--err:#b4301f;--ok:#15803d;--warn:#b45309}
[data-theme=rose]{--bg:#f7e9ea;--card:#fff6f6;--ink:#3a1a22;--mute:#86565f;--line:#ecd0d3;--accent:#a8475a;--accent-ink:#fff;--err:#b4301f;--ok:#15803d;--warn:#b45309}
[data-theme=plum]{--bg:#17101f;--card:#211830;--ink:#efe6f7;--mute:#b0a0c2;--line:#35264a;--accent:#c9a3e6;--accent-ink:#1a0f26;--err:#ff8b78;--ok:#4ade80;--warn:#fbbf24}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans","Noto Sans Thai","Noto Sans TC",sans-serif;padding-bottom:110px}
button,input,select{font:inherit;color:inherit}
.wrap{max-width:460px;margin:0 auto;padding:16px}
header{display:flex;align-items:center;justify-content:space-between;padding-top:6px}
h1{font-size:20px;margin:0}
.sub{font-size:12px;color:var(--mute);margin:2px 0 0}
.icons{display:flex;gap:8px}
.ibtn{width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:var(--card);display:grid;place-items:center;cursor:pointer}
.ibtn svg{width:19px;height:19px;stroke:var(--ink);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tabs{display:flex;gap:6px;margin:14px 0;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:4px}
.tabs button{flex:1;border:0;background:none;padding:9px;border-radius:10px;cursor:pointer;color:var(--mute);font-weight:600}
.tabs button.on{background:var(--accent);color:var(--accent-ink)}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;margin-bottom:12px}
.card h2{font-size:15px;margin:0 0 10px}
.lbl{font-size:12px;color:var(--mute);margin:0}
.big{font-size:32px;font-weight:700;margin:2px 0}
.mid{font-size:20px;font-weight:700;margin:2px 0}
.flex{display:flex;align-items:flex-end;justify-content:space-between;gap:10px}
.right{text-align:right}
.bar{height:12px;background:color-mix(in srgb,var(--ink) 10%,var(--card));border-radius:99px;overflow:hidden;margin-top:10px}
.bar>div{height:100%;border-radius:99px;transition:width .6s cubic-bezier(.2,.8,.2,1),background-color .3s;background:var(--ok)}
.bar>div.warn{background:var(--warn)}.bar>div.bad{background:var(--err)}
.ok{color:var(--ok)}.bad{color:var(--err)}.warnc{color:var(--warn)}
ul{list-style:none;margin:0;padding:0}
.row{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);cursor:pointer}
.row:last-child{border-bottom:0}
.dot{width:10px;height:10px;border-radius:50%;flex:none}
.rmain{flex:1;min-width:0}
.rt{margin:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rs{margin:0;font-size:12px;color:var(--mute)}
.amt{font-weight:700;white-space:nowrap}.amt.in{color:var(--ok)}
.empty{color:var(--mute);font-size:14px;margin:6px 0 0}
.alert{font-size:13px;padding:8px 10px;border-radius:10px;margin-bottom:8px;background:color-mix(in srgb,var(--warn) 14%,var(--card));color:var(--warn);border:1px solid color-mix(in srgb,var(--warn) 40%,var(--card))}
.alert.bad{background:color-mix(in srgb,var(--err) 14%,var(--card));color:var(--err);border-color:color-mix(in srgb,var(--err) 40%,var(--card))}
.mnav{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.mnav b{font-size:16px}
.mnav button{width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:var(--card);cursor:pointer;font-size:18px}
.mnav button:disabled{opacity:.35;cursor:default}
.three{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center}
.legend li{display:flex;justify-content:space-between;font-size:13px;padding:2px 0}
.legend .sw{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:8px}
.chartbox{position:relative;height:170px}
.donut{display:flex;align-items:center;gap:14px}.donut .chartbox{width:130px;height:130px;flex:none}.donut .legend{flex:1}
.brow{margin-bottom:12px}.brow:last-child{margin-bottom:0}
.brow .top{display:flex;justify-content:space-between;font-size:13px}
.btn{border:0;border-radius:12px;padding:12px 16px;cursor:pointer;font-weight:700;background:var(--accent);color:var(--accent-ink)}
.btn.sec{background:color-mix(in srgb,var(--ink) 9%,var(--card));color:var(--ink);font-weight:600}
.btn.dng{background:color-mix(in srgb,var(--err) 14%,var(--card));color:var(--err)}
.btn:disabled{opacity:.5}
.btn.full{width:100%}
.tips{white-space:pre-wrap;font-size:14px;margin:10px 0 0}
.bottom{position:fixed;left:0;right:0;bottom:0;padding:12px 16px calc(12px + env(safe-area-inset-bottom));background:linear-gradient(to top,var(--bg) 70%,transparent)}
.bottom .in{max-width:460px;margin:0 auto;display:flex;gap:10px}
.bottom label{flex:1;text-align:center;background:var(--accent);color:var(--accent-ink);font-weight:700;padding:15px;border-radius:16px;cursor:pointer}
.bottom label input{display:none}
.bottom button{padding:0 22px;border-radius:16px;border:1px solid var(--line);background:var(--card);cursor:pointer;font-weight:600}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;align-items:flex-end;justify-content:center;z-index:40}
.ov.open{display:flex}
.sheet{background:var(--card);width:100%;max-width:460px;border-radius:22px 22px 0 0;padding:18px 18px calc(18px + env(safe-area-inset-bottom));max-height:92vh;overflow:auto}
.sheet h3{margin:0 0 12px;font-size:17px}
.sheet .hd{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.sheet .hd h3{margin:0}
.fld{margin-bottom:10px}
.fld label{display:block;font-size:12px;color:var(--mute);margin-bottom:3px}
.fld input,.fld select{width:100%;padding:11px;border-radius:12px;border:1px solid var(--line);background:color-mix(in srgb,var(--ink) 5%,var(--card));outline:none}
.fld input:focus,.fld select:focus{border-color:var(--accent)}
.seg{display:flex;gap:6px;margin-bottom:12px}
.seg button{flex:1;padding:10px;border-radius:12px;border:1px solid var(--line);background:none;cursor:pointer;font-weight:600;color:var(--mute)}
.seg button.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.acts{display:flex;gap:8px;margin-top:6px}.acts .btn{flex:1}
.warnbox{font-size:12px;color:var(--warn);background:color-mix(in srgb,var(--warn) 14%,var(--card));border-radius:10px;padding:8px;margin:0 0 10px}
.chip{font-size:12px;padding:2px 9px;border-radius:99px;background:color-mix(in srgb,var(--ink) 10%,var(--card));color:var(--mute)}
.chip.good{background:color-mix(in srgb,var(--ok) 18%,var(--card));color:var(--ok)}
.chip.mid{background:color-mix(in srgb,var(--warn) 18%,var(--card));color:var(--warn)}
#preview{display:none;width:100%;max-height:150px;object-fit:contain;border-radius:10px;background:color-mix(in srgb,var(--ink) 8%,var(--card));margin-bottom:10px}
.themes{display:flex;flex-wrap:wrap;gap:8px}
.themes button{display:flex;align-items:center;gap:6px;padding:6px 10px 6px 6px;border-radius:99px;border:2px solid var(--line);background:none;cursor:pointer;font-size:13px}
.themes button.on{border-color:var(--accent)}
.themes i{width:20px;height:20px;border-radius:50%;border:1px solid rgba(0,0,0,.2);display:block}
.sec-t{font-size:13px;font-weight:700;margin:16px 0 8px;color:var(--mute);text-transform:uppercase;letter-spacing:.03em}
.cb{display:grid;grid-template-columns:1fr 120px;gap:8px;align-items:center;margin-bottom:6px;font-size:14px}
.cb input{padding:8px;border-radius:10px;border:1px solid var(--line);background:color-mix(in srgb,var(--ink) 5%,var(--card));width:100%}
.hint{font-size:12px;color:var(--mute);margin:4px 0 8px}
.msg{font-size:13px;margin:8px 0;min-height:18px}
.toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:99px;font-size:13px;z-index:70;opacity:0;pointer-events:none;transition:opacity .25s;max-width:90vw;text-align:center}
.toast.show{opacity:1}
#loading{z-index:60;align-items:center}
.spin{width:40px;height:40px;border:4px solid var(--accent);border-top-color:transparent;border-radius:50%;animation:sp 1s linear infinite;margin:0 auto}
@keyframes sp{to{transform:rotate(360deg)}}
.link{background:none;border:0;color:var(--accent);padding:6px 0;cursor:pointer;text-decoration:underline;font-size:13px}
.ov.gate{background:var(--bg);align-items:center;padding:16px}
.ov.gate .sheet{border-radius:22px}
.qr{text-align:center;margin-top:18px;padding-top:14px;border-top:1px solid var(--line)}
.qr img{width:176px;height:176px;background:#fff;padding:8px;border-radius:12px;image-rendering:pixelated}
.pill{width:auto;border-radius:99px;padding:0 14px;font-weight:700;font-size:13px;white-space:nowrap;color:var(--ink)}
.guest{display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:13px}
.guest .btn{padding:9px 14px;flex:none}
[hidden]{display:none!important}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1>SnapBudget</h1>
      <p id="today" class="sub"></p>
    </div>
    <div class="icons">
      <button class="ibtn" id="btnAccount" aria-label="account"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4.4 3.6-8 8-8s8 3.6 8 8"/></svg></button>
      <button class="ibtn" id="btnSettings" aria-label="settings"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg></button>
    </div>
  </header>

  <nav class="tabs">
    <button id="tabToday" class="on" data-tab="today" data-i18n="tab_today"></button>
    <button id="tabMonth" data-tab="month" data-i18n="tab_month"></button>
  </nav>

  <!-- TODAY -->
  <main id="vToday">
    <section class="card guest" id="guestHint" hidden><span data-i18n="guest_hint"></span><button class="btn" id="btnGuestLogin" data-i18n="login"></button></section>
    <section class="card">
      <p class="lbl" data-i18n="wallet"></p>
      <p class="big"><span id="wallet">0</span> <span class="lbl" id="cur">THB</span></p>
      <div class="three" style="margin-top:8px">
        <div style="text-align:left"><p class="lbl" data-i18n="out_today"></p><p class="mid" id="outToday">0</p></div>
        <div></div>
        <div class="right"><p class="lbl" data-i18n="in_today"></p><p class="mid ok" id="inToday">0</p></div>
      </div>
    </section>
    <section class="card">
      <div class="flex">
        <div><p class="lbl" data-i18n="daily_budget"></p><p class="mid"><span id="spentB">0</span> / <span id="budgetB">0</span></p></div>
        <div class="right"><p class="lbl" data-i18n="left"></p><p class="mid" id="leftB">0</p></div>
      </div>
      <div class="bar"><div id="dbar" style="width:0%"></div></div>
    </section>
    <div id="alerts"></div>
    <section class="card">
      <h2 data-i18n="list_today"></h2>
      <ul id="list"></ul>
      <p id="listEmpty" class="empty" data-i18n="no_records"></p>
    </section>
  </main>

  <!-- MONTH -->
  <main id="vMonth" hidden>
    <div class="mnav">
      <button id="mPrev" aria-label="prev">&lsaquo;</button>
      <b id="monthLabel"></b>
      <button id="mNext" aria-label="next">&rsaquo;</button>
    </div>
    <section class="card">
      <div class="three">
        <div><p class="lbl" data-i18n="m_income"></p><p class="mid ok" id="mIn">0</p></div>
        <div><p class="lbl" data-i18n="m_expense"></p><p class="mid" id="mOut">0</p></div>
        <div><p class="lbl" data-i18n="m_net"></p><p class="mid" id="mNet">0</p></div>
      </div>
    </section>
    <section class="card">
      <h2 data-i18n="by_cat"></h2>
      <div class="donut">
        <div class="chartbox"><canvas id="catChart"></canvas></div>
        <ul id="catLegend" class="legend"></ul>
      </div>
      <p id="catEmpty" class="empty" data-i18n="no_records"></p>
    </section>
    <section class="card">
      <h2 data-i18n="daily"></h2>
      <div class="chartbox"><canvas id="dayChart"></canvas></div>
    </section>
    <section class="card">
      <h2 data-i18n="budgets"></h2>
      <div id="budgetList"></div>
      <p id="budgetEmpty" class="empty" data-i18n="budgets_empty"></p>
    </section>
    <section class="card">
      <h2 data-i18n="ai_title"></h2>
      <button class="btn sec full" id="btnAi" data-i18n="ai_btn"></button>
      <p id="tips" class="tips"></p>
    </section>
    <section class="card">
      <div class="flex" style="align-items:center;margin-bottom:6px">
        <h2 style="margin:0" data-i18n="records"></h2>
        <button class="btn sec" id="btnCsv" data-i18n="export"></button>
      </div>
      <ul id="mList"></ul>
      <p id="mEmpty" class="empty" data-i18n="no_records"></p>
    </section>
  </main>
</div>

<div class="bottom"><div class="in">
  <label><span data-i18n="scan"></span><input id="file" type="file" accept="image/*"></label>
  <button id="btnManual" data-i18n="manual"></button>
</div></div>

<!-- loading -->
<div id="loading" class="ov"><div style="text-align:center;color:#fff"><div class="spin"></div><p style="margin-top:12px" data-i18n="scanning"></p></div></div>

<!-- entry modal -->
<div id="modal" class="ov"><div class="sheet">
  <div class="hd"><h3 id="mTitle"></h3><span id="conf" class="chip"></span></div>
  <div class="seg"><button id="segExp" data-i18n="expense"></button><button id="segInc" data-i18n="income"></button></div>
  <img id="preview" alt="">
  <p id="warn" class="warnbox" hidden></p>
  <div class="fld"><label data-i18n="amount"></label><input id="fAmount" type="number" step="0.01" inputmode="decimal"></div>
  <div class="fld"><label data-i18n="merchant"></label><input id="fMerchant" maxlength="80"></div>
  <div class="fld"><label data-i18n="category"></label><select id="fCat"></select></div>
  <div class="fld"><label data-i18n="date"></label><input id="fDate" type="date"></div>
  <div class="acts">
    <button class="btn dng" id="btnDelete" data-i18n="delete" hidden></button>
    <button class="btn sec" id="btnCancel" data-i18n="cancel"></button>
    <button class="btn" id="btnSave" data-i18n="save"></button>
  </div>
</div></div>

<!-- settings -->
<div id="sheetSet" class="ov"><div class="sheet">
  <div class="hd"><h3 data-i18n="settings"></h3><button class="btn sec" data-close="sheetSet" data-i18n="close"></button></div>
  <div class="fld"><label data-i18n="language"></label><select id="selLang"></select></div>
  <p class="sec-t" data-i18n="theme"></p>
  <div class="themes" id="themes"></div>
  <p class="sec-t" data-i18n="wallet"></p>
  <div class="fld"><label data-i18n="start_cash"></label><input id="sCash" type="number" step="0.01" inputmode="decimal"></div>
  <div class="fld"><label data-i18n="daily_budget"></label><input id="sBudget" type="number" step="1" inputmode="decimal"></div>
  <p class="sec-t" data-i18n="month_budgets"></p>
  <p class="hint" data-i18n="month_budgets_hint"></p>
  <div id="catBudgets"></div>
  <div class="qr qrbox"></div>
</div></div>

<!-- account -->
<div id="sheetAuth" class="ov"><div class="sheet">
  <div class="hd"><h3 id="authTitle" data-i18n="account"></h3><button class="btn sec" id="btnAuthClose" data-close="sheetAuth" data-i18n="close"></button></div>
  <div id="authOff" hidden><p class="hint" data-i18n="auth_off"></p><div class="qr qrbox"></div></div>
  <div id="authOut" hidden>
    <p class="hint" data-i18n="gate_sub"></p>
    <div class="fld"><label data-i18n="email"></label><input id="aEmail" type="email" autocomplete="email"></div>
    <div class="fld"><label data-i18n="password"></label><input id="aPass" type="password" autocomplete="current-password"></div>
    <div class="acts"><button class="btn" id="btnLogin" data-i18n="login"></button><button class="btn sec" id="btnSignup" data-i18n="signup"></button></div>
    <button class="link" id="btnForgot" data-i18n="forgot"></button>
    <div class="acts" id="googleRow" hidden><button class="btn sec" id="btnGoogle" data-i18n="google"></button></div>
    <div class="qr qrbox"></div>
  </div>
  <div id="authIn" hidden>
    <p id="whoami"></p>
    <div class="acts"><button class="btn sec" id="btnSync" data-i18n="sync_now"></button><button class="btn dng" id="btnLogout" data-i18n="logout"></button></div>
    <p class="sec-t" id="pwTitle" data-i18n="change_pw"></p>
    <div class="fld" id="cPassRow"><label data-i18n="cur_pw"></label><input id="cPass" type="password" autocomplete="current-password"></div>
    <div class="fld"><label data-i18n="new_pw"></label><input id="nPass" type="password" autocomplete="new-password"></div>
    <button class="btn sec full" id="btnChangePw" data-i18n="set_pw"></button>
    <div class="qr qrbox"></div>
  </div>
  <p id="authMsg" class="msg"></p>
</div></div>

<div id="toast" class="toast"></div>

<script>
// ===== CONFIG =====
const SUPABASE_URL = "https://iefrfqgvuperizvrxpsi.supabase.co";
const SUPABASE_KEY = window.SB_KEY || "";           // set in config.js (Publishable key, safe for the browser)
const ENABLE_GOOGLE = false;                         // set true only after Google login is set up in Supabase

// ===== CATEGORIES (keys stay English so old data keeps working) =====
const EXP = {
  "Food & Beverage":{k:"c_food",color:"#f59e0b"}, "Transport":{k:"c_transport",color:"#38bdf8"},
  "Shopping":{k:"c_shopping",color:"#a78bfa"}, "Groceries":{k:"c_groceries",color:"#34d399"},
  "Entertainment":{k:"c_fun",color:"#f472b6"}, "Bills":{k:"c_bills",color:"#fb7185"},
  "Health":{k:"c_health",color:"#2dd4bf"}, "Other":{k:"c_other",color:"#94a3b8"}
};

  "Salary":{k:"i_salary",color:"#22c55e"}, "Allowance":{k:"i_allowance",color:"#14b8a6"},
  "Gift":{k:"i_gift",color:"#ec4899"}, "OtherIncome":{k:"i_other",color:"#84cc16"}
};

// ===== HELPERS =====
const $ = id => document.getElementById(id);
const load = (k, d) => { try { const v = JSON.parse(localStorage.getItem(k)); return v == null ? d : v; } catch (e) { return d; } };
const save = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} };
const lsGet = k => { try { return localStorage.getItem(k); } catch (e) { return null; } };
const lsSet = (k, v) => { try { localStorage.setItem(k, v); } catch (e) {} };
const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[c]));
const fmt = n => Number(n).toLocaleString("en-US", { maximumFractionDigits: 2 });
const pad = n => String(n).padStart(2, "0");
const dayKey = d => { const x = new Date(d); return x.getFullYear() + "-" + pad(x.getMonth() + 1) + "-" + pad(x.getDate()); };
const css = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const uid = () => (window.crypto && crypto.randomUUID) ? crypto.randomUUID() : String(Date.now()) + Math.random().toString(16).slice(2);

// ===== STATE =====
const DEF = { budget: 500, currency: "THB", startCash: 0, catBudgets: {}, u: 0 };
let settings = Object.assign({}, DEF, load("sb_settings", {}));
if (!settings.catBudgets || typeof settings.catBudgets !== "object") settings.catBudgets = {};
let entries = load("sb_entries", []).filter(e => e && e.id).map(e => Object.assign({ type: "expense" }, e));
let deleted = load("sb_deleted", []);
let lang = lsGet("sb_lang");
if (!T[lang]) {
  const n = (navigator.language || "en").toLowerCase();
  lang = n.startsWith("zh") ? (/(cn|sg|hans)/.test(n) ? "cn" : "zh") : (Object.keys(T).find(k => k === n.slice(0, 2)) || "en");
}
let theme = lsGet("sb_theme");
if (!THEMES[theme]) theme = "auto";
let tab = "today", mOff = 0, pendingImg = null, editingId = null, mType = "expense";
let weekChart = null, catChart = null;

function t(k, v) {
  let s = (T[lang] && T[lang][k]) || T.en[k] || k;
  if (v) for (const x in v) s = s.split("{" + x + "}").join(v[x]);
  return s;
}
const catInfo = e => (e.type === "income" ? INC : EXP)[e.category] || { k: e.type === "income" ? "i_other" : "c_other", color: "#94a3b8" };

function persist() {
  save("sb_entries", entries); save("sb_deleted", deleted); save("sb_settings", settings);
  schedulePush();
}

function renderThemes() {

function applyTheme() {
  if (theme === "auto") document.documentElement.removeAttribute("data-theme");

// ===== RENDER =====
function monthSpent(cat, y, m) {
  return entries.filter(e => e.type !== "income" && e.category === cat && new Date(e.ts).getFullYear() === y && new Date(e.ts).getMonth() === m).reduce((s, e) => s + e.amount, 0);
}
function rowHtml(e, withDate) {
  const ci = catInfo(e), inc = e.type === "income", d = new Date(e.ts);
  const when = (withDate ? d.toLocaleDateString(LOC[lang], { month: "short", day: "numeric" }) + " " : "") + d.toLocaleTimeString(LOC[lang], { hour: "2-digit", minute: "2-digit" });
  return `<li class="row" data-id="${esc(e.id)}"><span class="dot" style="background:${ci.color}"></span><div class="rmain"><p class="rt">${esc(e.merchant || t("untitled"))}</p><p class="rs">${esc(t(ci.k))} · ${esc(when)}</p></div><span class="amt${inc ? " in" : ""}">${inc ? "+" : "-"}${fmt(e.amount)}</span></li>`;
}
function render() {
  const sum = (arr, ty) => arr.filter(e => e.type === ty).reduce((s, e) => s + e.amount, 0);
  const wallet = (Number(settings.startCash) || 0) + sum(entries, "income") - sum(entries, "expense");
  const todays = entries.filter(e => dayKey(e.ts) === dayKey(Date.now()));
  const out = sum(todays, "expense"), inn = sum(todays, "income");
  const left = settings.budget - out;
  const pct = settings.budget > 0 ? out / settings.budget * 100 : 0;
  $("cur").textContent = settings.currency;
  $("wallet").textContent = fmt(wallet);
  $("wallet").style.color = wallet < 0 ? "var(--err)" : "";
  $("outToday").textContent = fmt(out); $("inToday").textContent = fmt(inn);
  $("spentB").textContent = fmt(out); $("budgetB").textContent = fmt(settings.budget);
  $("leftB").textContent = fmt(left); $("leftB").className = "mid " + (left < 0 ? "bad" : "ok");
  const dbar = $("dbar"); dbar.style.width = Math.min(100, pct) + "%";
  dbar.className = pct >= 100 ? "bad" : pct >= 80 ? "warn" : "";
  $("list").innerHTML = todays.slice().sort((a, b) => b.ts - a.ts).map(e => rowHtml(e, false)).join("");
  $("listEmpty").hidden = todays.length > 0;

  // category budget alerts (current month)
  const now = new Date(), al = [];
  for (const k in EXP) {
    const b = Number(settings.catBudgets[k]) || 0;
    if (b <= 0) continue;
    const p = Math.round(monthSpent(k, now.getFullYear(), now.getMonth()) / b * 100);
    if (p >= 80) al.push(`<div class="alert${p >= 100 ? " bad" : ""}">${esc(t("budget_alert", { c: t(EXP[k].k), p }))}</div>`);
  }
  $("alerts").innerHTML = al.join("");
  if (tab === "month") renderMonth();
}
function renderMonth() {
  const base = new Date(); base.setDate(1); base.setMonth(base.getMonth() + mOff);
  const y = base.getFullYear(), m = base.getMonth();
  $("monthLabel").textContent = base.toLocaleDateString(LOC[lang], { year: "numeric", month: "long" });
  $("mNext").disabled = mOff >= 0;
  const list = entries.filter(e => { const d = new Date(e.ts); return d.getFullYear() === y && d.getMonth() === m; });
  const inn = list.filter(e => e.type === "income").reduce((s, e) => s + e.amount, 0);
  const out = list.filter(e => e.type !== "income").reduce((s, e) => s + e.amount, 0);
  $("mIn").textContent = fmt(inn); $("mOut").textContent = fmt(out);
  $("mNet").textContent = (inn - out >= 0 ? "+" : "") + fmt(inn - out);
  $("mNet").className = "mid " + (inn - out >= 0 ? "ok" : "bad");

  const byCat = {};
  list.filter(e => e.type !== "income").forEach(e => byCat[e.category] = (byCat[e.category] || 0) + e.amount);
  const keys = Object.keys(byCat).sort((a, b) => byCat[b] - byCat[a]);
  $("catEmpty").hidden = keys.length > 0;
  $("catLegend").innerHTML = keys.map(k => { const c = EXP[k] || EXP.Other; return `<li><span><span class="sw" style="background:${c.color}"></span>${esc(t(c.k))}</span><span>${fmt(byCat[k])}</span></li>`; }).join("");

  const dim = new Date(y, m + 1, 0).getDate();
  const dOut = Array(dim).fill(0), dIn = Array(dim).fill(0);
  list.forEach(e => { const d = new Date(e.ts).getDate() - 1; (e.type === "income" ? dIn : dOut)[d] += e.amount; });

  if (typeof Chart !== "undefined") {
    const ink = css("--mute"), line = css("--line");
    if (catChart) catChart.destroy();
    catChart = new Chart($("catChart"), { type: "doughnut",
      data: { labels: keys.map(k => t((EXP[k] || EXP.Other).k)), datasets: [{ data: keys.map(k => byCat[k]), backgroundColor: keys.map(k => (EXP[k] || EXP.Other).color), borderWidth: 0 }] },
      options: { maintainAspectRatio: false, plugins: { legend: { display: false } }, cutout: "62%" } });
    if (weekChart) weekChart.destroy();
    weekChart = new Chart($("dayChart"), { type: "bar",
      data: { labels: dOut.map((_, i) => i + 1), datasets: [
        { label: t("m_expense"), data: dOut, backgroundColor: css("--accent"), borderRadius: 4 },
        { label: t("m_income"), data: dIn, backgroundColor: css("--ok"), borderRadius: 4 } ] },
      options: { maintainAspectRatio: false, plugins: { legend: { labels: { color: ink, boxWidth: 12 } } },
        scales: { x: { ticks: { color: ink, maxTicksLimit: 10 }, grid: { display: false } }, y: { ticks: { color: ink }, grid: { color: line } } } } });
  }

  const rows = [];
  for (const k in EXP) {
    const b = Number(settings.catBudgets[k]) || 0;
    if (b <= 0) continue;
    const s = byCat[k] || 0, p = s / b * 100;
    rows.push(`<div class="brow"><div class="top"><span>${esc(t(EXP[k].k))}</span><span class="${p >= 100 ? "bad" : p >= 80 ? "warnc" : ""}">${fmt(s)} / ${fmt(b)} (${Math.round(p)}%)</span></div><div class="bar"><div class="${p >= 100 ? "bad" : p >= 80 ? "warn" : ""}" style="width:${Math.min(100, p)}%"></div></div></div>`);
  }
  $("budgetList").innerHTML = rows.join("");
  $("budgetEmpty").hidden = rows.length > 0;

  $("mList").innerHTML = list.slice().sort((a, b) => b.ts - a.ts).map(e => rowHtml(e, true)).join("");
  $("mEmpty").hidden = list.length > 0;
}

function dupWarning(amount, merchant) {
  if (!amount) return "";
  const hit = entries.find(e => e.type !== "income" && Math.abs(e.amount - amount) < 0.01 && Date.now() - e.ts < 30 * 60 * 1000);
  return hit ? t("dup_warn", { m: hit.merchant || t("untitled") }) : "";
}
$("btnSave").onclick = () => {
  const amount = parseFloat($("fAmount").value);
  if (!(amount > 0)) { $("fAmount").focus(); return; }
  const dv = $("fDate").value || dayKey(Date.now());
  const old = editingId ? entries.find(x => x.id === editingId) : null;
  let ts;
  if (old && dayKey(old.ts) === dv) ts = old.ts;
  else if (dv === dayKey(Date.now())) ts = Date.now();
  else { const p = dv.split("-").map(Number), n = new Date(); ts = new Date(p[0], p[1] - 1, p[2], n.getHours(), n.getMinutes()).getTime(); }
  const data = { ts, amount, type: mType, merchant: $("fMerchant").value.trim(), category: $("fCat").value, u: Date.now() };
  if (old) Object.assign(old, data);
  else entries.push(Object.assign({ id: uid(), currency: settings.currency }, data));
  persist(); closeModal(); render();

};
$("btnDelete").onclick = () => {

  entries = entries.filter(x => x.id !== editingId);
  if (!deleted.includes(editingId)) deleted.push(editingId);
  persist(); closeModal(); render();
};
function budgetToast(cat, d) {

  const p = Math.round(monthSpent(cat, d.getFullYear(), d.getMonth()) / b * 100);
  if (p >= 80) toast(t("budget_hit", { c: t(EXP[cat].k), p }));
}

// ===== PHOTO SCAN (same /api/analyze contract as before) =====
function compress(file, max = 1280) {
  return new Promise((resolve, reject) => {
    const img = new Image(), url = URL.createObjectURL(file);
    img.onload = () => {
      const r = Math.min(1, max / Math.max(img.width, img.height));
      const c = document.createElement("canvas");
      c.width = Math.round(img.width * r); c.height = Math.round(img.height * r);
      c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
      const u = c.toDataURL("image/jpeg", 0.82); URL.revokeObjectURL(url); resolve(u);
    };
    img.onerror = reject; img.src = url;
  });
}
$("file").addEventListener("change", async ev => {
  const f = ev.target.files[0]; ev.target.value = "";
  if (!f) return;
  $("loading").classList.add("open");
  try {
    pendingImg = await compress(f);
    const res = await fetch("/api/analyze", { method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ image: pendingImg.split(",")[1], mime: "image/jpeg", defaultCurrency: settings.currency }) });
    if (!res.ok) throw new Error((await res.text()) || res.status);
    const d = await res.json();
    const other = d.currency && String(d.currency).toUpperCase() !== settings.currency;
    openModal({ amount: d.amount, merchant: d.merchant, category: d.category, confidence: d.confidence, type: "expense" },
      { scan: true, warn: other ? t("cur_warn", { c: String(d.currency).toUpperCase(), d: settings.currency }) : "" });
  } catch (err) {
    console.error(err);
    openModal({ amount: "", category: "Other", type: "expense" }, { scan: true, warn: t("scan_fail", { e: String(err.message || err).slice(0, 60) }) });
  } finally { $("loading").classList.remove("open"); }
});

// ===== CSV =====
function csvCell(v) {
  let s = String(v == null ? "" : v);
  if (/^[=+\-@\t\r]/.test(s)) s = "'" + s;
  return /[",\n\r]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
}
function buildCsv() {
  const head = ["date", "time", "type", "category", "merchant", "amount", "currency"];
  const rows = entries.slice().sort((a, b) => a.ts - b.ts).map(e => {
    const d = new Date(e.ts);
    return [dayKey(d), pad(d.getHours()) + ":" + pad(d.getMinutes()), e.type, e.category, e.merchant || "", e.amount, e.currency || settings.currency];
  });
  return "﻿" + [head].concat(rows).map(r => r.map(csvCell).join(",")).join("\r\n");
}
$("btnCsv").onclick = () => {
  const blob = new Blob([buildCsv()], { type: "text/csv;charset=utf-8" });
  const a = document.createElement("a"); a.href = URL.createObjectURL(blob);
  a.download = "snapbudget-" + dayKey(Date.now()) + ".csv";
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 2000);
};

async function doAuth(mode) {
  if (!sb) return;
  const email = $("aEmail").value.trim(), pw = $("aPass").value;
  if (!email || pw.length < 6) { authMsg(t("auth_short"), true); return; }
  authMsg("...");
  const r = mode === "signup" ? await sb.auth.signUp({ email, password: pw }) : await sb.auth.signInWithPassword({ email, password: pw });
  if (r.error) { authMsg(r.error.message, true); return; }
  if (mode === "signup" && !(r.data && r.data.session)) { authMsg(t("verify_email")); return; }
  authMsg(""); $("aPass").value = ""; $("sheetAuth").classList.remove("open");
}

  if (r.error) { authMsg(r.error.message, true); return; }
  $("nPass").value = ""; $("cPass").value = ""; recovery = false; renderAuth(); authMsg(t("pw_changed"));
};

$("btnLogout").onclick = async () => {
  if (!sb || !user) return;
  while (syncing) await new Promise(r => setTimeout(r, 200));
  if (!(await syncNow())) return;      // never wipe the phone if the cloud copy is not up to date
  clearLocal();
  await sb.auth.signOut();
  syncState = ""; authMsg(""); $("sheetAuth").classList.remove("open");
};
$("btnSync").onclick = () => syncNow();
$("btnGuestLogin").onclick = () => { authMsg(""); renderAuth(); openSheet("sheetAuth"); };
$("btnGoogle").onclick = () => { if (sb) sb.auth.signInWithOAuth({ provider: "google", options: { redirectTo: location.origin } }); };
if (sb) {
  sb.auth.getSession().then(r => { user = (r.data && r.data.session && r.data.session.user) || null; })
    .catch(() => {}).then(() => { authReady = true; renderAuth(); if (user) syncNow(); });
  sb.auth.onAuthStateChange((ev, s) => {
    const u = (s && s.user) || null, changed = (u && u.id) !== (user && user.id);
    user = u;
    if (ev === "PASSWORD_RECOVERY") { recovery = true; setTimeout(() => { renderAuth(); openSheet("sheetAuth"); }, 0); }
    else renderAuth();
    if (user && changed && authReady) setTimeout(syncNow, 0);
  });
  setTimeout(() => { if (!authReady) { authReady = true; renderAuth(); } }, 4000);
}
function schedulePush() { if (!sb || !user) return; clearTimeout(pushTimer); pushTimer = setTimeout(syncNow, 800); }

async function cloudGet(k) {
  const r = await sb.from("user_data").select("data_value").eq("user_id", user.id).eq("data_key", k).maybeSingle();
  if (r.error) throw r.error;
  let v = r.data && r.data.data_value;
  if (typeof v === "string") { try { v = JSON.parse(v); } catch (e) {} }
  return v == null ? null : v;
}
async function cloudSet(k, v) {
  const write = async val => {
    const now = new Date().toISOString();
    const up = await sb.from("user_data").update({ data_value: val, updated_at: now }).eq("user_id", user.id).eq("data_key", k).select("data_key");
    if (up.error) return up.error;
    if (up.data && up.data.length) return null;
    const ins = await sb.from("user_data").insert({ user_id: user.id, data_key: k, data_value: val, updated_at: now });
    return ins.error || null;
  };
  const err = await write(asString ? JSON.stringify(v) : v);
  if (err && !asString) { const e2 = await write(JSON.stringify(v)); if (!e2) { asString = true; return; } }
  if (err) throw err;
}
async function syncNow() {
  if (!sb || !user) return false;
  if (syncing) { again = true; return false; }
  syncing = true; setSync("syncing");
  let ok = false;
  try {
    // data on this phone that belongs to a different account is dropped, never merged into this one
    const owner = lsGet("sb_owner");
    if (owner && owner !== user.id) { entries = []; deleted = []; settings = Object.assign({}, DEF, { catBudgets: {} }); }
    lsSet("sb_owner", user.id);
    const ce = await cloudGet("snapbudget:entries"), cd = await cloudGet("snapbudget:deleted"), cs = await cloudGet("snapbudget:settings");
    const del = new Set(deleted.concat(Array.isArray(cd) ? cd : []));
    const map = new Map();
    (Array.isArray(ce) ? ce : []).concat(entries).forEach(e => {
      if (!e || !e.id || del.has(e.id)) return;
      const o = map.get(e.id);
      if (!o || (e.u || e.ts) >= (o.u || o.ts)) map.set(e.id, Object.assign({ type: "expense" }, e));
    });
    entries = Array.from(map.values()).sort((a, b) => a.ts - b.ts);
    deleted = Array.from(del);
    if (cs && typeof cs === "object" && (cs.u || 0) > (settings.u || 0)) settings = Object.assign({}, DEF, cs);
    if (!settings.catBudgets || typeof settings.catBudgets !== "object") settings.catBudgets = {};
    save("sb_entries", entries); save("sb_deleted", deleted); save("sb_settings", settings);
    render();
    await cloudSet("snapbudget:entries", entries);
    await cloudSet("snapbudget:deleted", deleted);
    await cloudSet("snapbudget:settings", settings);
    setSync("ok"); ok = true;
  } catch (e) { console.error(e); setSync("fail", e && e.message); }
  finally { syncing = false; if (again) { again = false; schedulePush(); } }
  return ok;
}

// ===== START =====
applyTheme();
applyLang();
if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});
</script>
